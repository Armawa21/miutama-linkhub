<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIUTAMA</title>
<meta name="description" content="Links">
<link rel="icon" type="image/png" href="assets/Favicon%20500.png">
<link rel="apple-touch-icon" href="assets/Favicon%20500.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141414;
    --surface:#1c1c1c;
    --surface-hover:#242424;
    --text:#ededea;
    --text-muted:#8a8a86;
    --accent:#b3b2ad;
    --border:rgba(237,237,234,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:56px 20px 40px;
  }
  main{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .photo{
    width:104px;
    height:104px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid var(--border);
    background:var(--surface);
    margin-bottom:22px;
  }
  .photo-placeholder{
    width:104px;
    height:104px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    margin-bottom:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Bookman Old Style','URW Bookman','Georgia',serif;
    font-size:32px;
    color:var(--accent);
  }
  h1{
    font-family:'Bookman Old Style','URW Bookman','Georgia',serif;
    font-weight:400;
    font-size:30px;
    margin:0 0 10px;
    text-align:center;
    letter-spacing:0.3px;
  }
  .desc{
    font-size:14.5px;
    line-height:1.55;
    color:var(--text-muted);
    text-align:center;
    max-width:320px;
    margin:0 0 26px;
  }
  .socials{
    display:flex;
    gap:12px;
    margin-bottom:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .social-badge{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    text-decoration:none;
    transition:border-color .18s ease, background .18s ease;
  }
  .social-badge svg{ width:18px; height:18px; }
  .social-badge:hover{
    border-color:var(--accent);
    background:var(--surface);
  }
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .link-btn{
    position:relative;
    display:block;
    width:100%;
    padding:16px 20px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:3px;
    color:var(--text);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    text-align:center;
    overflow:hidden;
    transition:background .18s ease, border-color .18s ease;
  }
  .link-btn::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:var(--accent);
    transform:scaleY(0);
    transition:transform .22s ease;
  }
  .link-btn:hover{
    background:var(--surface-hover);
    border-color:var(--accent);
  }
  .link-btn:hover::before{
    transform:scaleY(1);
  }
  .top-socials{
    margin-bottom:22px;
  }
  .bottom-socials{
    margin-top:30px;
    margin-bottom:0;
  }
  .section{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:36px;
    padding-top:32px;
    border-top:1px solid var(--border);
  }
  .section:first-of-type{
    margin-top:8px;
  }
  .section-title{
    font-family:'Bookman Old Style','URW Bookman','Georgia',serif;
    font-weight:400;
    font-size:14px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:0 0 16px;
    text-align:center;
  }
  .section .links{
    margin-bottom:16px;
  }
  .section .links:last-child{
    margin-bottom:0;
  }
  footer{
    margin-top:44px;
    font-size:12px;
    color:var(--text-muted);
    opacity:0.6;
  }
  .empty-state{
    font-size:14px;
    color:var(--text-muted);
    text-align:center;
    padding:40px 0;
  }
</style>
</head>
<body>
  <main id="app">
    <div class="empty-state">Loading…</div>
  </main>

<script>
const ICONS = {
  instagram: '<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/>',
  tiktok: '<path d="M9 19a3.2 3.2 0 1 1 3.2-3.2V4"/><path d="M12.2 4c.4 2.7 2.6 4.8 5.3 5.1"/>',
  youtube: '<rect x="3" y="6" width="18" height="12" rx="3"/><path d="M10 9.3l6 2.7-6 2.7z" fill="currentColor" stroke="none"/>',
  facebook: '<circle cx="12" cy="12" r="8.5"/><path d="M13.5 8.2h-1c-1 0-1.5.5-1.5 1.5v1.6H9.5v2H11V17h2v-3.7h1.6l.3-2H13v-1.2c0-.4.2-.7.8-.7h1V8.2z" fill="currentColor" stroke="none"/>',
  x: '<circle cx="12" cy="12" r="8.5"/><path d="M8.3 8.3l7.4 7.4M15.7 8.3l-7.4 7.4"/>',
  linkedin: '<circle cx="12" cy="12" r="8.5"/><circle cx="8.7" cy="8.8" r="0.9" fill="currentColor" stroke="none"/><path d="M8.7 11.2v5.3M12 11.2v5.3M12 13.4c0-1.4 1-2.2 2-2.2s2 .7 2 2.2v3.1"/>',
  whatsapp: '<path d="M12 3.3a8.7 8.7 0 0 0-7.5 13l-1.2 4.2 4.4-1.1A8.7 8.7 0 1 0 12 3.3z"/><path d="M8.6 8.6c.2-.4.4-.4.6-.4h.4c.15 0 .3 0 .45.35.2.45.6 1.55.65 1.65.05.15.1.3 0 .45-.1.2-.15.25-.3.4-.15.15-.3.25-.15.5.4.65 1.4 1.7 2.6 2.15.2.05.3 0 .45-.15.15-.15.55-.6.7-.85.15-.2.3-.15.45-.1.2.1 1.2.55 1.4.65.2.1.3.15.35.25.05.1.05.55-.15 1.05-.2.5-1.05.95-1.45 1-.4.05-.8.1-2.6-.55-2.2-.8-3.6-3.05-3.75-3.2-.15-.15-1.05-1.35-1.05-2.6 0-1.25.65-1.85.8-2.1z" fill="currentColor" stroke="none"/>',
  email: '<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4.5 7.3l7.5 5.6 7.5-5.6"/>',
  spotify: '<circle cx="12" cy="12" r="8.5"/><path d="M7.2 9.8c3.2-1 6.4-.6 9 1"/><path d="M7.6 12.6c2.6-.8 5.2-.5 7.4.8"/><path d="M8.1 15.3c2-.5 4-.4 5.5.6"/>',
  pinterest: '<circle cx="12" cy="12" r="8.5"/><path d="M10.3 16.5L11.7 10.5"/><path d="M12 10c0-1.4.9-2.3 2.1-2.3 1.5 0 2.3 1 2.3 2.5 0 1.9-.9 3.6-2.4 3.6-.75 0-1.3-.4-1.5-.95"/>',
  threads: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6"/><path d="M14.6 12v1.1a1.8 1.8 0 0 0 3.4-.8c0-2.7-2-4.8-5.4-4.8-3.2 0-5.4 2.3-5.4 5.6s2.2 5.4 5.4 5.4c1.5 0 2.7-.45 3.6-1.2"/>',
  website: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.3 2.3 14.7 0 17M12 3.5c-2.3 2.3-2.3 14.7 0 17"/>',
  custom: '<path d="M9.5 14.5l5-5"/><path d="M8.3 11.7l-1.6 1.6a2.7 2.7 0 0 0 3.8 3.8l1.6-1.6"/><path d="M15.7 12.3l1.6-1.6a2.7 2.7 0 0 0-3.8-3.8l-1.6 1.6"/>'
};

function svgIcon(platform){
  const inner = ICONS[platform] || ICONS.custom;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

async function loadData(){
  try{
    const res = await fetch('./data.json?_=' + Date.now());
    if(!res.ok) throw new Error('fetch failed');
    return await res.json();
  }catch(e){
    return null;
  }
}

function initials(name){
  return (name || '').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

function renderSocials(socials, extraClass){
  if(!socials || !socials.length) return '';
  const items = socials.map(s => `
    <a class="social-badge" href="${escapeAttr(s.url)}" target="_blank" rel="noopener" aria-label="${escapeAttr(s.label || s.platform)}">${svgIcon(s.platform)}</a>
  `).join('');
  return `<div class="socials ${extraClass||''}">${items}</div>`;
}

function renderLinks(links){
  if(!links || !links.length) return '';
  return `<div class="links">${links.map(l => `<a class="link-btn" href="${escapeAttr(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.title)}</a>`).join('')}</div>`;
}

function renderSections(sections){
  if(!sections || !sections.length) return '';
  return sections.map(sec => `
    <div class="section">
      ${sec.title ? `<div class="section-title">${escapeHtml(sec.title)}</div>` : ''}
      ${renderLinks(sec.links)}
      ${renderSocials(sec.socials)}
    </div>
  `).join('');
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

async function render(){
  const app = document.getElementById('app');
  const data = await loadData();

  if(!data){
    app.innerHTML = '<div class="empty-state">Belum ada konten. Isi lewat halaman admin.</div>';
    return;
  }

  const profile = data.profile || {};
  const photoHtml = profile.photo
    ? `<img class="photo" src="${escapeAttr(profile.photo)}" alt="${escapeAttr(profile.name||'')}">`
    : `<div class="photo-placeholder">${escapeHtml(initials(profile.name))}</div>`;

  const groupSocialsHtml = renderSocials(data.socials, data.socialsPosition === 'bottom' ? 'bottom-socials' : 'top-socials');
  const sectionsHtml = renderSections(data.sections);
  const legacyLinksHtml = (!data.sections || !data.sections.length) ? renderLinks(data.links) : '';

  app.innerHTML = `
    ${photoHtml}
    <h1>${escapeHtml(profile.name || '')}</h1>
    ${profile.description ? `<p class="desc">${escapeHtml(profile.description)}</p>` : ''}
    ${data.socialsPosition !== 'bottom' ? groupSocialsHtml : ''}
    ${legacyLinksHtml}
    ${sectionsHtml}
    ${data.socialsPosition === 'bottom' ? groupSocialsHtml : ''}
    ${(!data.sections || !data.sections.length) && (!data.links || !data.links.length) ? '<div class="empty-state">Belum ada link.</div>' : ''}
    <footer>&copy; ${new Date().getFullYear()} ${escapeHtml(profile.name || '')}</footer>
  `;
}

render();
</script>
</body>
</html>
